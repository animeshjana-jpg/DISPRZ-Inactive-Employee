<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { background: #f0f2f5; font-family: 'Segoe UI', Arial, sans-serif; color: #1a1a2e; margin: 0; }

    /* ── Header ── */
    .dash-header {
      background: linear-gradient(135deg, #1565c0 0%, #0d47a1 100%);
      color: white; padding: 14px 24px;
      display: flex; align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    }
    .dash-header h4 { margin: 0; font-weight: 700; font-size: 1.05rem; letter-spacing: 0.01em; }
    .dash-header .sub { font-size: 0.75rem; opacity: 0.75; margin-top: 2px; }
    .dash-header .total-pill {
      background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.35);
      border-radius: 20px; padding: 4px 14px;
      font-size: 0.8rem; font-weight: 700;
    }

    /* ── Filter Card ── */
    .filter-card {
      background: white; border-radius: 12px;
      padding: 14px 18px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      margin-bottom: 18px;
    }
    .filter-card .f-title {
      font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: #6b7280; margin-bottom: 10px;
    }
    .form-select {
      border: 1.5px solid #e5e7eb; border-radius: 8px;
      font-size: 0.8rem; padding: 5px 10px; color: #374151;
      background-color: #fafafa;
    }
    .form-select:focus { border-color: #1565c0; box-shadow: 0 0 0 3px rgba(21,101,192,0.12); }
    .filter-label { font-size: 0.72rem; font-weight: 600; color: #374151; margin-bottom: 3px; }

    /* ── KPI Cards ── */
    .kpi-card {
      background: white; border-radius: 12px; padding: 18px 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      border-top: 4px solid #ccc; height: 100%;
    }
    .kpi-label { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #6b7280; }
    .kpi-num { font-size: 1.9rem; font-weight: 800; line-height: 1.1; margin-top: 4px; }
    .kpi-overall { border-top-color: #1565c0; }
    .kpi-overall .kpi-num { color: #1565c0; }
    .kpi-east   { border-top-color: #0f9d58; } .kpi-east .kpi-num   { color: #0f9d58; }
    .kpi-west   { border-top-color: #f4a60a; } .kpi-west .kpi-num   { color: #f4a60a; }
    .kpi-north  { border-top-color: #7b2ff7; } .kpi-north .kpi-num  { color: #7b2ff7; }
    .kpi-south  { border-top-color: #e53935; } .kpi-south .kpi-num  { color: #e53935; }
    .kpi-def    { border-top-color: #607d8b; } .kpi-def .kpi-num    { color: #607d8b; }

    /* ── Section Card ── */
    .section-card {
      background: white; border-radius: 12px; padding: 18px 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07); margin-bottom: 18px;
    }
    .section-title { font-size: 0.88rem; font-weight: 700; color: #111827; }

    /* ── Tabs ── */
    .nav-tabs { border-bottom: 2px solid #e5e7eb; flex-wrap: nowrap; overflow-x: auto; }
    .nav-tabs .nav-link {
      border: none; border-bottom: 2px solid transparent; margin-bottom: -2px;
      color: #6b7280; font-size: 0.78rem; font-weight: 600;
      padding: 7px 15px; border-radius: 0; white-space: nowrap;
    }
    .nav-tabs .nav-link:hover { color: #1565c0; background: #f0f7ff; }
    .nav-tabs .nav-link.active { color: #1565c0; border-bottom-color: #1565c0; background: transparent; }

    /* ── Tables ── */
    .table { font-size: 0.8rem; }
    .table th {
      background: #f8fafc; font-size: 0.68rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.05em; color: #6b7280;
      padding: 9px 12px; border-bottom: 2px solid #e5e7eb; white-space: nowrap;
    }
    .table td { padding: 9px 12px; color: #374151; border-bottom: 1px solid #f3f4f6; vertical-align: middle; }
    .table tbody tr:hover { background: #f8fafc; }
    .rank-cell { font-weight: 700; color: #9ca3af; width: 36px; }
    .name-cell { font-weight: 600; color: #111827; }
    .count-cell { font-weight: 800; font-size: 0.92rem; color: #111827; width: 130px; }
    .bar-wrap { background: #f3f4f6; border-radius: 4px; height: 7px; min-width: 100px; }
    .bar-fill { background: linear-gradient(90deg, #1565c0, #42a5f5); border-radius: 4px; height: 7px; transition: width 0.4s; }

    /* ── Raw Data ── */
    .raw-wrap { max-height: 420px; overflow-y: auto; }
    .raw-wrap thead th { position: sticky; top: 0; z-index: 2; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }

    /* ── Modal ── */
    .modal-fullscreen .modal-body { padding: 0; overflow: hidden; }
    .modal-table-wrap { height: calc(100vh - 57px); overflow-y: auto; }
    .modal-table-wrap thead th { position: sticky; top: 0; z-index: 2; }

    /* ── Loader ── */
    #loader {
      display: flex; flex-direction: column; justify-content: center;
      align-items: center; height: 100vh; gap: 14px; background: #f0f2f5;
    }
    #loader .load-text { color: #6b7280; font-size: 0.85rem; font-weight: 500; }

    /* Buttons */
    .btn-primary-sm { background: #1565c0; border-color: #1565c0; }
  </style>
</head>
<body>

<!-- Loader -->
<div id="loader">
  <div class="spinner-border text-primary" style="width:2.4rem;height:2.4rem;" role="status"></div>
  <div class="load-text">Loading Wishmaster data…</div>
</div>

<!-- Dashboard -->
<div id="dashboard" style="display:none;">

  <!-- Header -->
  <div class="dash-header">
    <div>
      <h4>Untrained Wishmaster Dashboard</h4>
      <div class="sub">Pending training compliance tracker</div>
    </div>
    <div class="ms-auto">
      <span class="total-pill" id="header-total">0 employees</span>
    </div>
  </div>

  <div class="container-fluid p-3">

    <!-- ── Filters ── -->
    <div class="filter-card">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <div class="f-title">Filters</div>
        <button class="btn btn-sm btn-outline-secondary" style="font-size:0.75rem;" onclick="resetFilters()">Reset All</button>
      </div>
      <div class="row g-2" id="filters-container"></div>
    </div>

    <!-- ── KPIs ── -->
    <div class="row g-3 mb-3" id="kpi-row">
      <div class="col-6 col-md-2">
        <div class="kpi-card kpi-overall">
          <div class="kpi-label">Overall Pending</div>
          <div class="kpi-num" id="kpi-overall">0</div>
        </div>
      </div>
      <!-- Zone KPIs appended here -->
    </div>

    <!-- ── Hierarchy View ── -->
    <div class="section-card">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="section-title">Hierarchy View</div>
        <span class="text-muted" style="font-size:0.75rem;" id="hier-count-label"></span>
      </div>
      <ul class="nav nav-tabs mb-3" id="hier-tabs"></ul>
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead id="hier-thead"></thead>
          <tbody id="hier-tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- ── Raw Data ── -->
    <div class="section-card">
      <!-- Single-row header: title | search | buttons -->
      <div class="d-flex align-items-center gap-2 mb-3" style="flex-wrap:wrap;">
        <div class="section-title mb-0 me-1" style="white-space:nowrap;">
          Raw Data <span class="text-muted fw-normal" style="font-size:0.72rem;" id="raw-count-label"></span>
        </div>
        <!-- Search -->
        <div style="display:flex;align-items:center;flex:1;min-width:200px;max-width:300px;border:2px solid #1565c0;border-radius:8px;background:#f0f7ff;padding:5px 10px;gap:6px;box-shadow:0 2px 6px rgba(21,101,192,0.15);">
          <input type="text" id="emp-search"
            placeholder="EMP ID / Profile ID / Hub Name"
            oninput="searchEmployee()"
            style="border:none;outline:none;flex:1;font-size:0.8rem;color:#1a1a2e;background:transparent;min-width:0;font-weight:500;">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="#1565c0" viewBox="0 0 16 16" style="flex-shrink:0;">
            <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398l3.85 3.85a1 1 0 0 0 1.415-1.415l-3.868-3.833zm-5.242 1.156a5.5 5.5 0 1 1 0-11 5.5 5.5 0 0 1 0 11z"/>
          </svg>
        </div>
        <span id="search-result-label" class="text-muted" style="font-size:0.72rem;white-space:nowrap;"></span>
        <button class="btn btn-link text-secondary p-0" id="clear-search-btn" onclick="clearSearch()" style="display:none;font-size:0.72rem;">Clear</button>
        <div class="ms-auto d-flex gap-2" style="flex-shrink:0;">
          <button class="btn btn-sm btn-outline-primary" onclick="openFullscreen()">Full Page View</button>
          <button class="btn btn-sm btn-success" onclick="downloadCSV()">Download CSV</button>
          <button class="btn btn-sm btn-warning fw-semibold" onclick="downloadAllCSV()">Download with all Mapping</button>
        </div>
      </div>
      <div class="raw-wrap table-responsive">
        <table class="table table-sm table-hover table-bordered mb-0">
          <thead class="table-light" id="raw-thead"></thead>
          <tbody id="raw-tbody"></tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<!-- Overdue Modules Detail Popup -->
<div class="modal fade" id="overdueModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered" style="max-width:480px;">
    <div class="modal-content" style="border-radius:12px;overflow:hidden;">
      <div class="modal-header py-2 px-3" style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
        <span class="fw-bold" style="font-size:0.85rem;color:#111827;">Overdue Modules</span>
        <button type="button" class="btn-close ms-auto" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body px-3 py-3" id="overdue-content" style="max-height:60vh;overflow-y:auto;font-size:0.82rem;color:#374151;"></div>
    </div>
  </div>
</div>

<!-- Full Page Modal -->
<div class="modal fade" id="fullModal" tabindex="-1">
  <div class="modal-dialog modal-fullscreen">
    <div class="modal-content">
      <div class="modal-header py-2 px-3">
        <span class="fw-bold" style="font-size:0.9rem;">Raw Data — Full View &nbsp;<span class="text-muted fw-normal" id="modal-count-label"></span></span>
        <div class="ms-auto d-flex gap-2 me-2">
          <button class="btn btn-sm btn-success" onclick="downloadCSV()">Download CSV</button>
          <button class="btn btn-sm btn-warning fw-semibold" onclick="downloadAllCSV()">Download with all Mapping</button>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="modal-table-wrap table-responsive">
          <table class="table table-sm table-hover table-bordered mb-0">
            <thead class="table-light" id="modal-thead"></thead>
            <tbody id="modal-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  let globalData = { headers: [], rows: [] };
  let filteredRows = [];
  let headerMap = {};
  let activeTab = '';

  const FILTER_COLS = ['Asset','Zone','GM','Region','RM','AM','CEC','L1 Lead'];
  const TAB_COLS    = ['GM','Region','RM','AM','CEC','L1 Lead','DH Name'];
  const ZONE_CLASS  = { east:'kpi-east', west:'kpi-west', north:'kpi-north', south:'kpi-south' };
  // Display label overrides — col key stays as raw data header, label shown in UI differs
  const DISPLAY_NAME = { 'CEC': 'Trainer' };
  function dispName(col) { return DISPLAY_NAME[col] || col; }

  // ── Bootstrap ─────────────────────────────────────────────
  google.script.run
    .withSuccessHandler(initDashboard)
    .withFailureHandler(function(err) {
      document.getElementById('loader').innerHTML =
        '<div class="text-center text-danger p-5"><strong>Failed to load data</strong><br><small>' + err.message + '</small></div>';
    })
    .getDashboardData();

  // Case-insensitive column index lookup
  function colIdx(col) {
    if (headerMap[col] !== undefined) return headerMap[col];
    const lower = col.toLowerCase();
    for (const k of Object.keys(headerMap)) {
      if (k.toLowerCase() === lower) return headerMap[k];
    }
    return undefined;
  }

  function initDashboard(data) {
    globalData = data;
    filteredRows = data.rows;
    data.headers.forEach((h, i) => { headerMap[h.trim()] = i; });
    buildFilters();
    buildTabs();
    renderAll();
    document.getElementById('loader').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
  }

  // ── Filters ───────────────────────────────────────────────
  function buildFilters() {
    const container = document.getElementById('filters-container');
    container.innerHTML = '';
    FILTER_COLS.forEach(col => {
      if (colIdx(col) === undefined) return;
      const vals = [...new Set(globalData.rows.map(r => String(r[colIdx(col)]).trim()))]
        .filter(v => v !== '').sort((a, b) => a.localeCompare(b));

      const div = document.createElement('div');
      div.className = 'col-md col-6';
      div.innerHTML = `
        <div class="filter-label">${dispName(col)}</div>
        <select class="form-select form-select-sm" id="filter-${col}" onchange="applyFilters('${col}')">
          <option value="">All ${dispName(col)}</option>
          ${vals.map(v => `<option value="${v.toLowerCase()}">${v}</option>`).join('')}
        </select>`;
      container.appendChild(div);
    });
  }

  // Rebuild options for a single filter dropdown based on currently available rows
  function rebuildOptions(col, availableRows) {
    const el = document.getElementById('filter-' + col);
    if (!el) return;
    const prevVal = el.value;
    const idx = colIdx(col);
    if (idx === undefined) return;

    const vals = [...new Set(availableRows.map(r => String(r[idx]).trim()))]
      .filter(v => v !== '').sort((a, b) => a.localeCompare(b));

    el.innerHTML = `<option value="">All ${dispName(col)}</option>` +
      vals.map(v => `<option value="${v.toLowerCase()}">${v}</option>`).join('');

    // Keep previous selection only if still valid, otherwise reset
    el.value = vals.some(v => v.toLowerCase() === prevVal) ? prevVal : '';
  }

  // Cascading filter: downstream filters update their options based on upstream selections
  function applyFilters(changedCol) {
    const changedIdx = changedCol !== undefined ? FILTER_COLS.indexOf(changedCol) : -1;
    let rows = globalData.rows;

    FILTER_COLS.forEach((col, i) => {
      // Rebuild options for all filters after the one that changed
      if (i > changedIdx) rebuildOptions(col, rows);

      // Apply this filter to narrow rows for the next iteration
      const el = document.getElementById('filter-' + col);
      if (!el || el.value === '') return;
      rows = rows.filter(row => {
        const idx = colIdx(col);
        return idx !== undefined && String(row[idx]).trim().toLowerCase() === el.value;
      });
    });

    filteredRows = rows;
    renderAll();
  }

  function resetFilters() {
    buildFilters();          // fully rebuild all options from globalData.rows
    filteredRows = globalData.rows;
    renderAll();
  }

  // ── Tabs ──────────────────────────────────────────────────
  function buildTabs() {
    const ul = document.getElementById('hier-tabs');
    ul.innerHTML = '';
    const available = TAB_COLS.filter(c => colIdx(c) !== undefined);
    activeTab = available[0] || '';
    available.forEach((col, i) => {
      ul.innerHTML += `
        <li class="nav-item">
          <button class="nav-link ${i === 0 ? 'active' : ''}"
            onclick="switchTab('${col}', this)">${dispName(col)}</button>
        </li>`;
    });
  }

  function switchTab(col, btn) {
    document.querySelectorAll('#hier-tabs .nav-link').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeTab = col;
    renderHierarchy();
  }

  // ── Render All ────────────────────────────────────────────
  function renderAll() {
    const n = filteredRows.length;
    document.getElementById('kpi-overall').textContent = n.toLocaleString();
    document.getElementById('header-total').textContent = n.toLocaleString() + ' employees';
    // Reset employee search when filters change
    const searchEl = document.getElementById('emp-search');
    if (searchEl) { searchEl.value = ''; }
    const clearBtn = document.getElementById('clear-search-btn');
    if (clearBtn) clearBtn.style.display = 'none';
    const lbl = document.getElementById('search-result-label');
    if (lbl) lbl.textContent = '';
    renderZoneKPIs();
    renderHierarchy();
    renderRawTable();
  }

  // ── Zone KPIs ─────────────────────────────────────────────
  function renderZoneKPIs() {
    document.querySelectorAll('.zone-kpi-col').forEach(el => el.remove());
    const zIdx = colIdx('Zone');
    if (zIdx === undefined) return;

    const counts = {};
    filteredRows.forEach(r => {
      const z = (String(r[zIdx] || '')).trim() || 'No Mapping';
      counts[z] = (counts[z] || 0) + 1;
    });

    const kpiRow = document.getElementById('kpi-row');
    Object.entries(counts).sort((a, b) => b[1] - a[1]).forEach(([zone, cnt]) => {
      const cls = ZONE_CLASS[zone.toLowerCase()] || 'kpi-def';
      const col = document.createElement('div');
      col.className = 'col-6 col-md-2 zone-kpi-col';
      col.innerHTML = `
        <div class="kpi-card ${cls}">
          <div class="kpi-label">${zone}</div>
          <div class="kpi-num">${cnt.toLocaleString()}</div>
        </div>`;
      kpiRow.appendChild(col);
    });
  }

  const ZONE_BADGE = {
    east:  { bg:'#e8f5e9', color:'#1b5e20', border:'#a5d6a7' },
    west:  { bg:'#fff8e1', color:'#e65100', border:'#ffe082' },
    north: { bg:'#ede7f6', color:'#4527a0', border:'#ce93d8' },
    south: { bg:'#ffebee', color:'#b71c1c', border:'#ef9a9a' }
  };

  function zoneBadgeHtml(zone) {
    const s = zone.toLowerCase();
    const style = ZONE_BADGE[s] || { bg:'#f3f4f6', color:'#374151', border:'#d1d5db' };
    return `<span style="display:inline-block;padding:2px 8px;border-radius:10px;font-size:0.7rem;font-weight:700;
      background:${style.bg};color:${style.color};border:1px solid ${style.border};white-space:nowrap;">${escHtml(zone)}</span>`;
  }

  // ── Hierarchy Table ───────────────────────────────────────
  function renderHierarchy() {
    if (!activeTab) return;
    const cIdx = colIdx(activeTab);
    const zIdx = colIdx('Zone');
    const counts = {};
    const zoneSets = {};

    filteredRows.forEach(r => {
      let v = (cIdx !== undefined && r[cIdx] !== undefined && r[cIdx] !== '') ? String(r[cIdx]).trim() : 'No Mapping';
      counts[v] = (counts[v] || 0) + 1;
      if (!zoneSets[v]) zoneSets[v] = new Set();
      if (zIdx !== undefined) {
        const z = String(r[zIdx] || '').trim();
        if (z) zoneSets[v].add(z);
      }
    });

    const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    const max = sorted.length ? sorted[0][1] : 1;

    document.getElementById('hier-count-label').textContent = sorted.length + ' entries';
    document.getElementById('hier-thead').innerHTML = `
      <tr>
        <th>#</th>
        <th>${dispName(activeTab)}</th>
        <th>Zone</th>
        <th>Pending Employees</th>
        <th style="min-width:120px;"></th>
      </tr>`;

    document.getElementById('hier-tbody').innerHTML = sorted.map(([name, cnt], i) => {
      const zones = [...(zoneSets[name] || [])].sort();
      const zoneCells = zones.length ? zones.map(zoneBadgeHtml).join(' ') : '<span style="color:#9ca3af;font-size:0.75rem;">—</span>';
      return `
        <tr>
          <td class="rank-cell">${i + 1}</td>
          <td class="name-cell">${escHtml(name)}</td>
          <td>${zoneCells}</td>
          <td class="count-cell">${cnt.toLocaleString()}</td>
          <td>
            <div class="bar-wrap">
              <div class="bar-fill" style="width:${Math.round((cnt / max) * 100)}%"></div>
            </div>
          </td>
        </tr>`;
    }).join('');
  }

  // Columns to display in the raw data table (order preserved)
  const RAW_COLS = [
    'employee_external_id', 'profile_id', 'first_name', 'last_name',
    'line_of_business', 'joining_date', 'name', 'overdue_modules'
  ];

  // Build { colName: index } only for RAW_COLS that exist in the data
  function rawColMap() {
    return RAW_COLS.map(c => ({ name: c, idx: colIdx(c) })).filter(c => c.idx !== undefined);
  }

  function buildRawRow(row, cols) {
    return cols.map(c => {
      const val = String(row[c.idx] || '');
      if (c.name === 'overdue_modules' && val.trim() !== '') {
        const safe = val.replace(/'/g, "\\'").replace(/\n/g, '\\n');
        return `<td><a href="javascript:void(0)" onclick="showOverdue('${safe}')"
          style="font-size:0.78rem;color:#1565c0;text-decoration:none;font-weight:600;">
          View Modules</a></td>`;
      }
      return `<td>${escHtml(val)}</td>`;
    }).join('');
  }

  // ── Raw Data Table ────────────────────────────────────────
  // ── Employee Search ───────────────────────────────────────
  function searchEmployee() {
    const term = (document.getElementById('emp-search').value || '').trim().toLowerCase();
    const clearBtn = document.getElementById('clear-search-btn');
    const label = document.getElementById('search-result-label');

    if (!term) {
      clearBtn.style.display = 'none';
      label.textContent = '';
      renderRawTable(filteredRows);
      return;
    }

    clearBtn.style.display = '';
    const eidIdx = colIdx('employee_external_id');
    const pidIdx = colIdx('profile_id');
    const nameIdx = colIdx('name');
    const results = filteredRows.filter(row => {
      const eid  = eidIdx  !== undefined ? String(row[eidIdx]  || '').toLowerCase() : '';
      const pid  = pidIdx  !== undefined ? String(row[pidIdx]  || '').toLowerCase() : '';
      const name = nameIdx !== undefined ? String(row[nameIdx] || '').toLowerCase() : '';
      return eid.includes(term) || pid.includes(term) || name.includes(term);
    });

    label.textContent = results.length + ' match' + (results.length !== 1 ? 'es' : '') + ' found';
    renderRawTable(results);
  }

  function clearSearch() {
    document.getElementById('emp-search').value = '';
    document.getElementById('clear-search-btn').style.display = 'none';
    document.getElementById('search-result-label').textContent = '';
    renderRawTable(filteredRows);
  }

  function renderRawTable(rows) {
    rows = rows || filteredRows;
    const n = rows.length;
    const total = filteredRows.length;
    const cols = rawColMap();
    document.getElementById('raw-count-label').textContent =
      '(' + total.toLocaleString() + ' rows' + (total > 500 ? ', showing first 500' : '') + ')';

    document.getElementById('raw-thead').innerHTML =
      '<tr>' + cols.map(c => `<th>${escHtml(c.name)}</th>`).join('') + '</tr>';

    let body = rows.slice(0, 500).map(row =>
      '<tr>' + buildRawRow(row, cols) + '</tr>'
    ).join('');
    if (n > 500) {
      body += `<tr><td colspan="${cols.length}" class="text-center text-muted py-2" style="font-size:0.78rem;">
        Showing first 500 of ${n.toLocaleString()} records. Use <strong>Download CSV</strong> or <strong>Full Page View</strong> for all data.
      </td></tr>`;
    }
    if (n === 0) {
      body = `<tr><td colspan="${cols.length}" class="text-center text-muted py-3" style="font-size:0.82rem;">No matching records found.</td></tr>`;
    }
    document.getElementById('raw-tbody').innerHTML = body;
  }

  // ── Full Page Modal ───────────────────────────────────────
  function openFullscreen() {
    const n = filteredRows.length;
    const cols = rawColMap();
    document.getElementById('modal-count-label').textContent = '(' + n.toLocaleString() + ' rows)';

    document.getElementById('modal-thead').innerHTML =
      '<tr>' + cols.map(c => `<th>${escHtml(c.name)}</th>`).join('') + '</tr>';
    document.getElementById('modal-tbody').innerHTML = filteredRows.map(row =>
      '<tr>' + buildRawRow(row, cols) + '</tr>'
    ).join('');

    new bootstrap.Modal(document.getElementById('fullModal')).show();
  }

  // ── Overdue Modules Popup ─────────────────────────────────
  function showOverdue(raw) {
    // Split by common delimiters and render as a numbered list
    const items = raw.split(/[,;\n]+/).map(s => s.trim()).filter(Boolean);
    const html = items.length > 1
      ? '<ol style="margin:0;padding-left:18px;line-height:1.8;">' +
          items.map(m => `<li>${escHtml(m)}</li>`).join('') + '</ol>'
      : `<p style="margin:0;">${escHtml(raw)}</p>`;
    document.getElementById('overdue-content').innerHTML = html;
    new bootstrap.Modal(document.getElementById('overdueModal')).show();
  }

  // ── CSV Download ──────────────────────────────────────────
  function downloadCSV() {
    if (!filteredRows.length) { alert('No data to export.'); return; }
    let csv = globalData.headers.join(',') + '\r\n';
    filteredRows.forEach(row => {
      csv += row.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',') + '\r\n';
    });
    const a = document.createElement('a');
    a.href = 'data:text/csv;charset=utf-8,' + encodeURI(csv);
    a.download = 'Untrained_Wishmaster_Data.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }

  // Downloads all original columns (including all mapping columns)
  function downloadAllCSV() {
    if (!filteredRows.length) { alert('No data to export.'); return; }
    let csv = globalData.headers.join(',') + '\r\n';
    filteredRows.forEach(row => {
      csv += row.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',') + '\r\n';
    });
    const a = document.createElement('a');
    a.href = 'data:text/csv;charset=utf-8,' + encodeURI(csv);
    a.download = 'Untrained_Wishmaster_Full_Mapping.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }

  // ── Utility ───────────────────────────────────────────────
  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
